name: Real season analysis
on: workflow_dispatch
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m epl_lab.prepare_data --possession
      - run: python -m epl_lab.analyze
      - run: python -m epl_lab.execute_notebooks
      - uses: actions/upload-artifact@v4
        with:
          name: real-season-reports
          path: |
            outputs/
            notebooks/executed/
          retention-days: 14
